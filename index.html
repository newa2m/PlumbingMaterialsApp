<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>حصر خامات السباكة</title><style>
:root{--green:#144637;--bg:#f7f7f2;--paper:white;--text:#172d23;--muted:#56695e;--line:#d5ddd6;--accent:#c85a17}*{box-sizing:border-box}body{margin:0;background:#e9eee9;font-family:Tahoma,Arial,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px}header{background:var(--green);color:white;padding:19px 17px}header h1{font-size:21px;margin:0 0 7px}header small{opacity:.87}main{padding:17px 16px 24px;flex:1}.shell{max-width:520px;min-height:100dvh;margin:auto;background:var(--bg);box-shadow:0 6px 38px #0002;display:flex;flex-direction:column}h2{font-size:20px;margin:4px 0 12px}h3{font-size:16px;margin:0 0 9px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:15px;margin:11px 0}.btn{border:0;border-radius:11px;padding:11px 13px;background:var(--green);color:white;font-weight:bold}.outline{background:var(--paper);color:var(--green);border:1px solid var(--green)}.danger{color:#a32626;background:#fff1ee;border:1px solid #e6c9c3}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{width:100%}label{display:block;font-size:13px;font-weight:bold;margin:11px 0 6px}input,select,textarea{width:100%;border:1px solid #b6c9be;border-radius:9px;padding:11px 12px;background:white;color:#172d23;min-height:45px}textarea{min-height:70px}.muted{color:var(--muted);font-size:13px;line-height:1.65}.tiny{font-size:12px}.pill{background:#e1eee5;border-radius:12px;color:#17513f;padding:5px 9px;font-size:12px;font-weight:bold}.line{border-bottom:1px solid var(--line);padding:12px 0}.line:last-child{border-bottom:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1}.nav{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px}.nav button{font-size:12px;background:none;border:0;color:var(--muted);padding:5px}.nav button.active{color:var(--green);font-weight:bold}.note{background:#eaf1eb;border-right:4px solid #408469;padding:11px;border-radius:8px;margin:11px 0;font-size:13px}.warn{background:#fff2e7;border-right-color:var(--accent)}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.qty{font-size:19px;font-weight:bold}.hide{display:none!important}.print-only{display:none}body.dark{--bg:#121a15;--paper:#1e2923;--text:#ecf6ee;--muted:#b6cabc;--line:#526157;--green:#367861;background:#0b130e}body.dark input,body.dark select,body.dark textarea{background:#24342a;color:#ecf6ee}body.dark .note{background:#284035}body.sun{--bg:#fff;--paper:#fff;--text:#000;--muted:#171717;--line:#000;--green:#000;background:#fff}body.sun .pill{background:#f6f6f6;color:#000}@media print{body{background:#fff!important;color:#000!important}.shell{box-shadow:none;max-width:none;background:#fff}.nav,.noprint,header{display:none!important}.print-only{display:block}main{padding:0}.card{break-inside:avoid;border:0;padding:4px 0}.line{break-inside:avoid}}
</style></head><body><div class="shell"><header><h1>حصر خامات السباكة</h1><small id="sub">إدارة المعاينات والكميات</small></header><main id="main"></main><nav id="nav" class="nav noprint"></nav></div><script>
'use strict';const KEY='plumbing_takeoff_v3';const LEGACY='hesra_v2';const defaults=()=>({schema:3,active:null,projects:[],catalog:[{id:'c1',name:'ماسورة PPR',spec:'25 مم',unit:'متر'},{id:'c2',name:'كوع PPR 90°',spec:'25 مم',unit:'قطعة'},{id:'c3',name:'تيه PPR',spec:'25 مم',unit:'قطعة'},{id:'c4',name:'جلبة PPR',spec:'25 مم',unit:'قطعة'},{id:'c5',name:'محبس زاوية',spec:'½ بوصة',unit:'قطعة'},{id:'c6',name:'ماسورة صرف PVC',spec:'110 مم',unit:'متر'}],mode:'light'});let data=load();let page='home',editing=null,reportMode='purchase';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto?.randomUUID?.()||('id_'+Date.now()+'_'+Math.random().toString(36).slice(2));function validItem(x){return x&&typeof x.id==='string'&&typeof x.name==='string'&&x.name.trim()&&typeof x.spec==='string'&&x.spec.trim()&&typeof x.unit==='string'&&x.unit.trim()&&typeof x.place==='string'&&x.place.trim()&&typeof x.qty==='number'&&Number.isFinite(x.qty)&&x.qty>0&&x.qty<=1000000}function validProject(p){return p&&typeof p.id==='string'&&typeof p.name==='string'&&p.name.trim()&&typeof p.client==='string'&&Array.isArray(p.places)&&p.places.every(x=>typeof x==='string'&&x.trim())&&Array.isArray(p.items)&&p.items.every(validItem)}function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return defaults();let x=JSON.parse(raw);if(x.schema!==3||!Array.isArray(x.projects)||!x.projects.every(validProject)||!Array.isArray(x.catalog))throw Error('bad data');return x}catch(e){return defaults()}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('تعذر الحفظ: مساحة المتصفح ممتلئة. نزّل نسخة احتياطية الآن.')}}function project(){return data.projects.find(x=>x.id===data.active)||null}function choose(id){data.active=id;save();go('takeoff')}function go(p){page=p;render()}function norm(x){return String(x).trim().replace(/\s+/g,' ').toLocaleLowerCase('ar')}function group(items){let m=new Map();for(const x of items){const key=JSON.stringify([norm(x.name),norm(x.spec),norm(x.unit)]);if(!m.has(key))m.set(key,{name:x.name.trim(),spec:x.spec.trim(),unit:x.unit.trim(),qty:0,places:[]});let y=m.get(key);y.qty+=x.qty;if(!y.places.includes(x.place))y.places.push(x.place)}return [...m.values()]}function line(x,actions=true){return `<div class="line row"><div><b>${esc(x.name)} · ${esc(x.spec)}</b><div class="muted">${esc(x.place)} · ${esc(x.unit)}</div></div><div style="text-align:left"><div class="qty">${x.qty}</div>${actions?`<button class="btn outline" onclick="edit('${x.id}')">تعديل</button>`:''}</div></div>`}function options(names,selected){return names.map(n=>`<option value="${esc(n)}" ${n===selected?'selected':''}>${esc(n)}</option>`).join('')}function render(){document.body.className=data.mode==='dark'?'dark':data.mode==='sun'?'sun':'';const p=project();const labels={home:'المشروعات',new:'بيانات المشروع',takeoff:'المعاينة',add:'إضافة / تعديل بند',review:'المراجعة',report:'التقارير',settings:'الإعدادات',catalog:'كتالوج الخامات'};$('sub').textContent=labels[page];const nav=[['home','⌂','المشروعات'],['takeoff','▤','المعاينة'],['add','＋','إضافة بند'],['report','▣','التقرير'],['settings','⚙','الإعدادات']];$('nav').innerHTML=nav.map(([k,i,t])=>`<button class="${page===k?'active':''}" onclick="${k==='add'?'startAdd()':`go('${k}')`}"><div style="font-size:23px">${i}</div>${t}</button>`).join('');let h='';
if(page==='home')h=`<h2>ابدأ الحصر</h2><p class="muted">سجّل احتياجات السباكة أثناء المعاينة، حتى من غير بيانات العميل.</p><div class="card stack"><button class="btn full" onclick="quickTakeoff()">⚡ حصر سريع الآن</button><button class="btn outline full" onclick="newProject()">＋ معاينة مشروع جديد</button></div><div class="row"><h3>مشروعاتي وقوائم الحصر</h3><span class="pill">${data.projects.length}</span></div>${data.projects.map(x=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><span class="pill">${x.items.length} بند</span></div><p class="muted">${esc(x.client||'بدون اسم عميل')} · ${x.places.length} أماكن</p><div class="toolbar"><button class="btn" onclick="choose('${x.id}')">فتح</button><button class="btn outline" onclick="choose('${x.id}');go('new')">تعديل</button><button class="btn danger" onclick="removeProject('${x.id}')">حذف</button></div></div>`).join('')||'<div class="empty">لا توجد قوائم بعد. ابدأ بحصر سريع أو معاينة جديدة.</div>'}`;
if(page==='new')h=`<h2>${p?'بيانات المشروع':'مشروع جديد'}</h2><label>اسم المشروع *</label><input id="pn" maxlength="120" value="${esc(p?.name||'')}" placeholder="شقة أ/ أحمد - التجمع"><label>اسم العميل</label><input id="pc" maxlength="120" value="${esc(p?.client||'')}"><label>عنوان المشروع</label><input id="pa" maxlength="200" value="${esc(p?.address||'')}"><label>رقم الهاتف (اختياري)</label><input id="pt" type="tel" maxlength="30" value="${esc(p?.phone||'')}"><button class="btn full" style="margin-top:18px" onclick="saveProject()">حفظ ومتابعة المعاينة</button><button class="btn outline full" style="margin-top:8px" onclick="go('home')">رجوع</button>`;
if(page==='takeoff')h=p?`<div class="row"><h2>${esc(p.name)}</h2><button class="btn outline" onclick="go('new')">${p.quick?'تحويل لمشروع':'بيانات'}</button></div><p class="muted">العميل: ${esc(p.client||'غير محدد')}</p><div class="card"><h3>أماكن المعاينة</h3><div class="row"><input id="placeNew" placeholder="مثال: الدور الأول - الحمام الرئيسي"><button class="btn" onclick="addPlace()">إضافة</button></div>${p.places.map(x=>`<div class="line row"><span>${esc(x)}</span><div><span class="pill">${p.items.filter(z=>z.place===x).length} بنود</span> <button class="btn outline" onclick="selectPlace('${encodeURIComponent(x)}')">اختيار</button></div></div>`).join('')||'<div class="empty">أضف أول مكان لبدء الحصر.</div>'}</div>${p.places.length?`<label>المكان الحالي</label><select id="currentPlace" onchange="setPlace(this.value)">${options(p.places,p.currentPlace)}</select><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="startAdd()">＋ أضف خامة</button><button class="btn outline" onclick="go('review')">راجع البنود</button></div><div class="card"><b>خامات ${esc(p.currentPlace)}</b>${p.items.filter(x=>x.place===p.currentPlace).map(x=>line(x)).join('')||'<div class="empty">لم تُضف خامات في هذا المكان.</div>'}</div>`:''}`:'<div class="empty">أنشئ مشروعًا أو اختر مشروعًا أولًا.</div><button class="btn full" onclick="newProject()">مشروع جديد</button>';
if(page==='add')h=p&&p.places.length?`<h2>${editing?'تعديل بند':'إضافة خامة جديدة'}</h2><div class="note">تجميع الشراء يعتمد على الاسم والمواصفة والوحدة معًا.</div><label>اختيار من الكتالوج (اختياري)</label><select id="preset" onchange="applyPreset()"><option value="">اكتب صنفًا أو اختره</option>${data.catalog.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} · ${esc(c.spec)}</option>`).join('')}</select><label>اسم الخامة *</label><input id="in" maxlength="120" value="${esc(editing?.name||'')}" placeholder="مثال: كوع PPR 90°"><label>المقاس والمواصفة *</label><input id="is" maxlength="120" value="${esc(editing?.spec||'')}" placeholder="مثال: 25 مم"><div class="grid"><div><label>الوحدة *</label><select id="iu">${options(['قطعة','متر','لفة','علبة','كجم','طقم','عدد'],editing?.unit||'قطعة')}</select></div><div><label>الكمية *</label><input id="iq" type="number" min="0.001" max="1000000" step="any" inputmode="decimal" value="${editing?.qty||1}"></div></div><label>مكان الاستخدام</label><select id="ip">${options(p.places,editing?.place||p.currentPlace)}</select><label>ملاحظات</label><textarea id="ino" maxlength="500" placeholder="ملاحظات اختيارية">${esc(editing?.notes||'')}</textarea><button class="btn full" onclick="saveLine()">${editing?'حفظ التعديل':'إضافة الصنف'}</button>${editing?`<button class="btn danger full" style="margin-top:9px" onclick="deleteLine()">حذف هذا البند</button>`:''}<button class="btn outline full" style="margin-top:9px" onclick="editing=null;go('takeoff')">إلغاء</button>`:`<div class="empty">اختر مشروعًا وأضف مكانًا قبل تسجيل الخامات.</div><button class="btn" onclick="go('takeoff')">الذهاب للمعاينة</button>`;
if(page==='review')h=p?`<h2>مراجعة الحصر التفصيلي</h2><p class="muted">راجع المقاسات والكميات والأماكن قبل الاعتماد.</p><div class="card">${p.items.map(x=>line(x)).join('')||'<div class="empty">لم تُسجل خامات.</div>'}</div><div class="note ${p.approvedAt&&p.approvedRevision===p.revision?'':'warn'}">${p.approvedAt&&p.approvedRevision===p.revision?'✓ الحصر معتمد، ويمكن إصداره.':'الحصر لم يُعتمد بعد أو تم تعديله بعد آخر اعتماد.'}</div><button class="btn full" ${p.items.length?'':'disabled'} onclick="approve()">✓ اعتماد الحصر الحالي</button><button class="btn outline full" style="margin-top:9px" onclick="go('report')">عرض التقرير</button>`:'<div class="empty">اختر مشروعًا أولًا.</div>';
if(page==='report')h=p?`<div class="noprint"><h2>تقارير المشروع</h2><div class="toolbar"><button class="btn ${reportMode==='purchase'?'':'outline'}" onclick="reportMode='purchase';render()">قائمة الشراء</button><button class="btn ${reportMode==='places'?'':'outline'}" onclick="reportMode='places';render()">حسب المكان</button></div>${p.approvedAt&&p.approvedRevision===p.revision?'<div class="note">✓ الحصر معتمد.</div>':'<div class="note warn">مسودة غير معتمدة. راجع البنود واعتمدها قبل مشاركتها مع العميل.</div>'}</div><div class="card" id="reportBody"><h2 class="print-only">حصر خامات السباكة</h2><h3>${esc(p.name)}</h3><p class="muted">العميل: ${esc(p.client||'—')} · العنوان: ${esc(p.address||'—')}</p><p class="muted">${p.approvedAt&&p.approvedRevision===p.revision?'معتمد':'مسودة غير معتمدة'}</p>${reportMode==='purchase'?`<h3>إجمالي طلب الشراء</h3>${group(p.items).map(x=>`<div class="line row"><div><b>${esc(x.name)} · ${esc(x.spec)}</b><div class="muted">${esc(x.unit)} · ${esc(x.places.join('، '))}</div></div><span class="qty">${Number(x.qty.toFixed(4))}</span></div>`).join('')||'<div class="empty">لا توجد خامات.</div>'}`:`<h3>الكميات حسب الأماكن</h3>${p.places.map(place=>`<h3 style="margin-top:20px">${esc(place)}</h3>${p.items.filter(x=>x.place===place).map(x=>line(x,false)).join('')||'<p class="muted">لا توجد خامات.</p>'}`).join('')}`}</div><div class="noprint toolbar"><button class="btn" onclick="window.print()">طباعة / PDF</button><button class="btn outline" onclick="exportCsv()">تنزيل CSV</button><button class="btn outline" onclick="copyReport()">نسخ</button></div><p class="muted noprint">CSV يفتح في Excel، وPDF عبر نافذة طباعة المتصفح.</p>`:'<div class="empty">اختر مشروعًا أولًا.</div>';
if(page==='settings')h=`<h2>الإعدادات والبيانات</h2><div class="card"><h3>طريقة العرض</h3><div class="toolbar">${[['light','نهاري'],['dark','ليلي'],['sun','تحت الشمس']].map(([k,t])=>`<button class="btn ${data.mode===k?'':'outline'}" onclick="data.mode='${k}';save();render()">${t}</button>`).join('')}</div></div><div class="card"><h3>النسخ الاحتياطي</h3><p class="muted">احفظ نسخة JSON من جميع المشروعات. الاستعادة تستبدل البيانات الحالية بعد التأكيد.</p><button class="btn full" onclick="backup()">تنزيل نسخة احتياطية</button><label>استعادة النسخة</label><input type="file" accept=".json,application/json" onchange="restore(this)"></div><div class="card"><h3>كتالوج السباكة</h3><button class="btn outline full" onclick="go('catalog')">إدارة أصناف الكتالوج</button></div><div class="card"><h3>استيراد من النموذج القديم</h3><button class="btn outline full" onclick="importLegacy()">استيراد حصر V2 إن وجد</button><p class="muted">الاستيراد يضيف مشروعًا جديدًا ولا يحذف المشروعات الحالية.</p></div>`;
if(page==='catalog')h=`<h2>كتالوج خامات السباكة</h2><p class="muted">أضف الأصناف الشائعة للاستدعاء السريع، ولا تعتمد على قائمة ثابتة فقط.</p><label>اسم الصنف</label><input id="cn" placeholder="مثال: سيفون أرضي"><label>المواصفة</label><input id="cs" placeholder="مثال: 4 بوصة"><label>الوحدة</label><select id="cu">${options(['قطعة','متر','لفة','علبة','كجم','طقم','عدد'],'قطعة')}</select><button class="btn full" style="margin-top:12px" onclick="addCatalog()">إضافة للكتالوج</button><div class="card">${data.catalog.map(c=>`<div class="line row"><span>${esc(c.name)} · ${esc(c.spec)} · ${esc(c.unit)}</span><button class="btn danger" onclick="deleteCatalog('${c.id}')">حذف</button></div>`).join('')}</div>`;
$('main').innerHTML=h}
function quickTakeoff(){const stamp=new Date().toLocaleDateString('ar-EG');let p={id:uid(),name:'حصر سريع - '+stamp,client:'',address:'',phone:'',places:['عام'],currentPlace:'عام',items:[],revision:0,approvedRevision:-1,approvedAt:null,quick:true};data.projects.unshift(p);data.active=p.id;save();go('takeoff')}function newProject(){data.active=null;editing=null;go('new')}function saveProject(){const n=$('pn').value.trim();if(!n)return alert('اسم المشروع مطلوب');let p=project();if(!p){p={id:uid(),name:n,client:'',address:'',phone:'',places:[],currentPlace:'',items:[],revision:0,approvedRevision:-1,approvedAt:null};data.projects.unshift(p);data.active=p.id}p.name=n;p.quick=false;p.client=$('pc').value.trim();p.address=$('pa').value.trim();p.phone=$('pt').value.trim();save();go('takeoff')}function removeProject(id){if(!confirm('حذف المشروع وكل بنوده نهائيًا؟ تأكد من النسخة الاحتياطية أولًا.'))return;data.projects=data.projects.filter(x=>x.id!==id);if(data.active===id)data.active=null;save();render()}function touch(p){p.revision++;p.approvedAt=null;save()}function addPlace(){let p=project(),s=$('placeNew').value.trim().replace(/\s+/g,' ');if(!s)return alert('اكتب اسم المكان');if(p.places.some(x=>norm(x)===norm(s)))return alert('المكان موجود بالفعل');p.places.push(s);p.currentPlace=s;touch(p);render()}function selectPlace(encoded){let p=project(),s=decodeURIComponent(encoded);if(!p.places.includes(s))return;p.currentPlace=s;save();render()}function setPlace(s){let p=project();if(!p.places.includes(s))return;p.currentPlace=s;save();render()}function startAdd(){editing=null;go('add')}function edit(id){let p=project();editing=p?.items.find(x=>x.id===id)||null;go('add')}function applyPreset(){const c=data.catalog.find(x=>x.id===$('preset').value);if(c){$('in').value=c.name;$('is').value=c.spec;$('iu').value=c.unit}}function saveLine(){let p=project();if(!p)return;let name=$('in').value.trim().replace(/\s+/g,' '),spec=$('is').value.trim().replace(/\s+/g,' '),unit=$('iu').value,qty=Number($('iq').value),place=$('ip').value,notes=$('ino').value.trim();if(!name||!spec||!unit||!p.places.includes(place)||!Number.isFinite(qty)||qty<=0||qty>1000000)return alert('راجع الاسم والمقاس والمكان والكمية؛ الكمية يجب أن تكون أكبر من صفر.');if(editing){Object.assign(p.items.find(x=>x.id===editing.id),{name,spec,unit,qty,place,notes})}else p.items.push({id:uid(),name,spec,unit,qty,place,notes});p.currentPlace=place;touch(p);editing=null;go('takeoff')}function deleteLine(){if(!editing||!confirm('حذف هذا البند؟'))return;let p=project();p.items=p.items.filter(x=>x.id!==editing.id);touch(p);editing=null;go('review')}function approve(){let p=project();if(!p?.items.length)return alert('لا يمكن اعتماد حصر فارغ');p.approvedRevision=p.revision;p.approvedAt=new Date().toISOString();save();go('report')}function addCatalog(){let name=$('cn').value.trim(),spec=$('cs').value.trim(),unit=$('cu').value;if(!name||!spec)return alert('الاسم والمواصفة مطلوبان');if(data.catalog.some(x=>norm(x.name)===norm(name)&&norm(x.spec)===norm(spec)&&norm(x.unit)===norm(unit)))return alert('الصنف موجود');data.catalog.push({id:uid(),name,spec,unit});save();render()}function deleteCatalog(id){if(!confirm('حذف الصنف من الكتالوج؟ لن تُحذف البنود المسجلة في المشروعات.'))return;data.catalog=data.catalog.filter(x=>x.id!==id);save();render()}
function csvSafe(s){let v=String(s??'');if(/^[\s]*[=+@\-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}function exportCsv(){let p=project();if(!p)return;let rows=[['حصر خامات السباكة',p.name],['العميل',p.client],['حالة التقرير',p.approvedAt&&p.approvedRevision===p.revision?'معتمد':'مسودة'],[],['الصنف','المواصفة','الوحدة','الكمية','المكان']];if(reportMode==='purchase')rows.push(...group(p.items).map(x=>[x.name,x.spec,x.unit,x.qty,x.places.join('، ')]));else rows.push(...p.items.map(x=>[x.name,x.spec,x.unit,x.qty,x.place]));download('\ufeff'+rows.map(r=>r.map(csvSafe).join(',')).join('\r\n'),'حصر-خامات-السباكة.csv','text/csv;charset=utf-8')}function download(s,name,type){let u=URL.createObjectURL(new Blob([s],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}function copyReport(){let p=project();if(!p)return;const l=reportMode==='purchase'?group(p.items).map(x=>`${x.name} | ${x.spec}: ${x.qty} ${x.unit}`):p.items.map(x=>`${x.place} | ${x.name} | ${x.spec}: ${x.qty} ${x.unit}`);let t=`حصر خامات السباكة\n${p.name}\n${p.approvedAt&&p.approvedRevision===p.revision?'معتمد':'مسودة'}\n`+l.join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert('تم النسخ')).catch(()=>prompt('انسخ النص:',t));else prompt('انسخ النص:',t)}function backup(){download(JSON.stringify(data,null,2),'حصر-خامات-السباكة-نسخة-احتياطية.json','application/json')}function restore(el){let f=el.files?.[0];if(!f)return;if(f.size>5*1024*1024)return alert('ملف كبير جدًا');f.text().then(t=>{try{let x=JSON.parse(t);if(x.schema!==3||!Array.isArray(x.projects)||!x.projects.every(validProject)||!Array.isArray(x.catalog)||!x.catalog.every(c=>c&&typeof c.id==='string'&&typeof c.name==='string'&&typeof c.spec==='string'&&typeof c.unit==='string'))throw Error();if(!confirm('سيتم استبدال كل البيانات الحالية. هل لديك نسخة احتياطية؟'))return;data=x;save();go('home')}catch(e){alert('ملف النسخة غير صالح أو غير متوافق')}})}function importLegacy(){let raw=localStorage.getItem(LEGACY);if(!raw)return alert('لم أجد بيانات V2 في هذا المتصفح');try{let old=JSON.parse(raw);if(!Array.isArray(old.items)||!old.items.every(x=>x&&typeof x.name==='string'&&typeof x.size==='string'&&typeof x.unit==='string'&&typeof x.place==='string'&&Number(x.qty)>0&&Number.isFinite(Number(x.qty))))throw Error();const places=[...new Set(old.items.map(x=>x.place))],p={id:uid(),name:old.project||'مشروع مستورد',client:old.client||'',address:'',phone:'',places,currentPlace:places[0]||'',items:old.items.map(x=>({id:uid(),name:x.name,spec:x.size,unit:x.unit,place:x.place,qty:Number(x.qty),notes:''})),revision:1,approvedRevision:-1,approvedAt:null};if(!validProject(p))throw Error();if(!confirm('إضافة مشروع مستورد من بيانات V2؟'))return;data.projects.unshift(p);data.active=p.id;save();go('takeoff')}catch(e){alert('تعذر استيراد النسخة القديمة')}}render();
</script></body></html>
