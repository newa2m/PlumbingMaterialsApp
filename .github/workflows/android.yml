name: Flutter Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android platform files exist
        run: flutter create --platforms=android --project-name plumbing_takeoff .

      - name: Remove only generated Flutter sample test
        shell: bash
        run: |
          # flutter create may add the stock test/widget_test.dart when the
          # repository has no generated platform project yet. It references
          # MyApp, which is intentionally not part of this application.
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
          fi

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plumbing-takeoff-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
